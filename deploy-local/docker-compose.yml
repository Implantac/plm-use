# Espelho local do PLM USE: Postgres + GoTrue (auth) + PostgREST + Storage +
# app SSR (nitro) atras de um gateway nginx num único localhost:8080.
# Use via plm-local.bat (um clique). Nada aqui toca o projeto Lovable/produção.
name: plmuse-local

# IMPORTANTE (23/out): supabase/gotrue e storage-api NAO publicam tag "latest"
# no Docker Hub — imagens deste stack devem ficar PINADAS a versoes existentes
# (conferidas via hub.docker.com/v2/repositories/.../tags em 23/10/2026).
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      # initdb roda em ordem alfabética APENAS no primeiro boot (volume vazio)
      - ./initdb/00_roles.sql:/docker-entrypoint-initdb.d/00_roles.sql:ro
      - ./initdb/01_run.sh:/docker-entrypoint-initdb.d/01_run.sh:ro
      - ../supabase/migrations:/sql/supabase:ro
      - ../drizzle/migrations:/sql/drizzle:ro
      - ../docs/producao:/sql/seed:ro
      - ./initdb:/sql/initdb:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  gotrue:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${DB_PASSWORD}@db:5432/postgres?sslmode=disable
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: "36000"
      GOTRUE_JWT_AUDIENCE: authenticated
      GOTRUE_SITE_URL: ${APP_URL}
      API_EXTERNAL_URL: ${APP_URL}/auth
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_LOG_LEVEL: info
      GOTRUE_OPERATOR_TOKEN: local-op-token
    command: start

  postgrest:
    image: postgrest/postgrest:v16.5
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://postgres:${DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PORT: "3000"

  storage:
    image: supabase/storage-api:v1.84.20
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@db:5432/postgres
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
      GLOBAL_S3_ENDPOINT: http://storage:5000
      PORT: "5000"
    volumes:
      - storage-data:/var/lib/storage

  web:
    build:
      context: ..
      dockerfile: deploy-local/Dockerfile.web
      args:
        VITE_SUPABASE_URL: ${APP_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
    restart: unless-stopped
    depends_on:
      - postgrest
      - gotrue
    environment:
      PORT: "3000"
      HOST: 0.0.0.0

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - web
      - postgrest
      - gotrue
      - storage
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  storage-data:
