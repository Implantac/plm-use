# Gateway de origem única: o app fala /auth/v1, /rest/v1, /storage/v1 e o
# resto é o servidor SSR do frontend. Os prefixos são retirados nos proxies
# porque GoTrue/PostgREST/storage-api servem suas rotas na raiz.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""    close;
}

server {
    listen 80;
    client_max_body_size 50m;

    location /auth/ {
        rewrite ^/auth/v1/(.*) /$1 break;
        proxy_pass http://gotrue:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rest/ {
        rewrite ^/rest/v1/(.*) /$1 break;
        proxy_pass http://postgrest:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        rewrite ^/storage/v1/(.*) /$1 break;
        proxy_pass http://storage:5000;
        proxy_set_header Host $host;
        client_max_body_size 50m;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
