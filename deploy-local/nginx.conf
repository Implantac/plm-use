# Gateway de origem única: o app fala /auth/v1, /rest/v1, /storage/v1 e o
# resto é o servidor SSR do frontend. Os prefixos são retirados nos proxies
# porque GoTrue/PostgREST/storage-api servem suas rotas na raiz.
#
# IMPORTANTE (23/out, crash-loop real do dono): proxy_pass com NOME fixo faz o
# nginx resolver o DNS no boot — se o upstream estiver em restart, o nginx
# morre junto ("host not found in upstream"). Por isso o DNS do Docker é usado
# via resolver + variável: a resolução acontece a cada request e o gateway
# fica de pé respondendo 502 enquanto o backend se recupera.
resolver 127.0.0.11 valid=5s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""    close;
}

server {
    listen 80;
    client_max_body_size 50m;

    location /auth/ {
        set $up_auth http://gotrue:9999;
        rewrite ^/auth/v1/(.*) /$1 break;
        proxy_pass $up_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rest/ {
        set $up_rest http://postgrest:3000;
        rewrite ^/rest/v1/(.*) /$1 break;
        proxy_pass $up_rest;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        set $up_storage http://storage:5000;
        rewrite ^/storage/v1/(.*) /$1 break;
        proxy_pass $up_storage;
        proxy_set_header Host $host;
        client_max_body_size 50m;
    }

    location / {
        set $up_web http://web:3000;
        proxy_pass $up_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
