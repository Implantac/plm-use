# CI mínima do USE MODA PLM — o gate que faltava (revisão 08/10/2026, P0-3).
#
# Ordem deliberada: formatação → lint → tipos → testes → build.
# O `prettier --check` vem primeiro porque erros de estilo dominavam o eslint
# (todos com --fix disponível); separá-los dá sinais melhores no PR.
#
# E2E (tests/e2e/*.spec.py, Playwright/Python) não roda em PR: precisa de um
# ambiente com Supabase real. É job próprio, disparado à mão (workflow_dispatch)
# contra a URL de staging — ver job e2e-staging e scripts/run-e2e.sh.
#
# Contexto (docs/github-lovable-sync.md): o repo tem sync bidirecional com o
# Lovable na main. Esta CI corre também nos commits do bot (funil de qualidade
# para o editor) e NUNCA faz deploy — deploy é só o Lovable, via push na main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL do ambiente a testar (staging)"
        required: true
        default: "https://staging.usemoda.ai"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: "--max-old-space-size=6144" # build precisa de >1.3 GB; folga p/ nitro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16" # >=22.12 exigido pelo wrapper Lovable (package.json engines)
          cache: npm

      - name: Install (lock do npm é registro, não dogma)
        # npm ci primeiro (determinístico); cai para `npm install` se o lock
        # divergiu — o sync do Lovable edita package.json via bun e o
        # package-lock nem sempre acompanha. Vermelho por lock velho polui o
        # histórico do main; regenerar o lock é tarefa do próximo lote nosso.
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Prettier (estilo)
        run: npx prettier --check .

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários (Vitest)
        run: npm test

      - name: Build (vite + nitro, preset cloudflare-module)
        run: npm run build

  # Aplicar as migrations num Postgres limpo e rodar o fluxo de pedido de ponta
  # a ponta. Existe porque em 21/10/2026 a revisao achou uma migration que so
  # quebrava em projeto novo (dependia de tabelas da trilha Drizzle). Nenhum
  # teste de TypeScript pegaria isso: aqui o banco e de verdade, com RLS, grants
  # e funcoes SECURITY DEFINER exercitados como usuario final.
  db-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Migrations + E2E do fluxo de pedido
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash scripts/certify-db.sh

  # Runner único dos 6 specs Playwright (Sprint 3): o script assume venv,
  # chromium e health-check; o job só fornece a URL do ambiente. `environment`
  # dá proteção de aprovação quando o env "staging" existir no repo.
  e2e-staging:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
      url: ${{ inputs.base_url }}
    env:
      PLM_E2E_BASE: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: E2E (scripts/run-e2e.sh)
        run: bash scripts/run-e2e.sh
